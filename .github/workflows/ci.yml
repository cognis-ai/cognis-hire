name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install

      - name: Run Biome
        run: yarn check:ci

      - name: Verify production build
        # Catches type errors and missing-env failures that biome misses.
        # DATABASE_URL is required by prisma generate (run via postinstall).
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hire
          CLERK_SECRET_KEY: sk_test_ci_placeholder_not_used_at_build_time
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: yarn build

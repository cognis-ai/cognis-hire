# Build + publish the Cognis Hire image to GHCR (founder decision AC-5,
# DECISIONS-2026-06-11: registry = ghcr.io/cognis-ai/*). Image name follows
# the deployment map's §4.1 pipeline register (`hire`):
#   ghcr.io/cognis-ai/hire
# Builds Dockerfile.cognis (NOT the upstream Dockerfile — see its header for
# the prisma/postinstall fix). Base `node:23-alpine` is version-tag pinned;
# no :latest-risk flag was raised for this repo in gate1/gate2.
# Coolify deploys reference the pushed DIGEST, not a moving tag
# (cognis-platform/docs/plans/build/deployment-map.md §4.1).
name: Publish image (GHCR)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cognis-ai/hire

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cognis
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Emit deployable digest
        run: |
          echo "Deployable artifact (pin this digest in Coolify):"
          echo "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}"
